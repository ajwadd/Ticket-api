version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: eventpro-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventpro_db}
      POSTGRES_USER: ${POSTGRES_USER:-eventpro_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
